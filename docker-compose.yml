services:
  mysql:
    image: mysql:8.4
    container_name: finanzas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finanzas_db
      MYSQL_USER: finanzas_user
      MYSQL_PASSWORD: finanzas_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: